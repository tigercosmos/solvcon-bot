name: CI

on:
  push:
    branches: [main]
  pull_request:
  # workflow_dispatch lets the e2e workflow (and a human) trigger this
  # same build/test path manually.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install OpenSSL (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install OpenSSL (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake build-essential

      # Drives apply_solvcon_patches.sh, cmake configure, cmake build,
      # then ctest. Same code path a developer hits locally with
      # `make` + `make test`.
      - name: Build
        run: make build

      - name: Unit tests
        run: make test
        timeout-minutes: 10
